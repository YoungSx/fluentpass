name: Deploy GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag to deploy (e.g. v1.2.0, leave empty to auto-detect)'
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Version Information
        id: version_step
        shell: bash
        run: |
          VERSION="${{ inputs.tag_name }}"
          if [ -z "$VERSION" ]; then
            if [[ "${{ github.ref_type }}" == "tag" ]]; then
              VERSION="${{ github.ref_name }}"
            else
              TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
              if [ -n "$TAG" ]; then
                VERSION="$TAG"
              else
                VERSION="v1.2.0"
              fi
            fi
          fi
          if [[ ! "$VERSION" =~ ^v ]]; then
            VERSION="v$VERSION"
          fi
          echo "RESOLVED_VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building FluentPass Pages with version: $VERSION"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'docs/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm --dir docs install --frozen-lockfile

      - name: Build Next.js Static Export
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ steps.version_step.outputs.RESOLVED_VERSION }}
        run: pnpm --dir docs build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
