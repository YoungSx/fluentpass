name: CI Pipeline

on:
  push:
    branches: [ master, main, 'chore/**', 'feature/**', 'fix/**' ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
      - '*.sln'
      - '*.slnx'
      - 'build.*'
  pull_request:
    branches: [ master, main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
      - '*.sln'
      - '*.slnx'
      - 'build.*'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # =========================================================================
  # Layer 1: Build & Fast-Fail Unit Tests (Windows)
  # =========================================================================
  build:
    name: Build & Unit Tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Cache KeePass 2.x
        id: cache-keepass
        uses: actions/cache@v4
        with:
          path: C:\Program Files\KeePass Password Safe 2
          key: keepass-2.57.1-win

      - name: Download and Setup KeePass 2.x
        if: steps.cache-keepass.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $keepassDir = "C:\Program Files\KeePass Password Safe 2"
          New-Item -ItemType Directory -Path $keepassDir -Force | Out-Null

          $downloadUrl = "https://downloads.sourceforge.net/project/keepass/KeePass%202.x/2.57.1/KeePass-2.57.1.zip"
          $zipPath = "$env:TEMP\keepass.zip"

          Write-Host "Downloading KeePass 2.x from SourceForge..."
          try {
            curl.exe -fSL "$downloadUrl" -o "$zipPath"
            tar.exe -xf "$zipPath" -C "$keepassDir"
          } catch {
            Write-Warning "Direct curl/tar extraction failed: $_. Falling back to Chocolatey..."
            choco install keepass -y --no-progress
          }

          if (-not (Test-Path "$keepassDir\KeePass.exe")) {
            choco install keepass -y --no-progress
          }

          if (-not (Test-Path "$keepassDir\KeePass.exe")) {
            throw "Failed to locate KeePass.exe at $keepassDir"
          }
          Write-Host "KeePass 2.x is ready at $keepassDir"

      - name: Restore NuGet Packages
        run: dotnet restore FluentPass.sln

      - name: Build FluentPass (Release)
        run: msbuild FluentPass.sln /p:Configuration=Release /p:Platform="Any CPU" /p:KeePassDir="C:\Program Files\KeePass Password Safe 2"

      - name: Deploy Built Plugin for Diagnostic Tests
        shell: pwsh
        run: |
          $pluginDir = "C:\Program Files\KeePass Password Safe 2\Plugins"
          New-Item -ItemType Directory -Path $pluginDir -Force | Out-Null
          Copy-Item "src\FluentPass\bin\Release\net48\FluentPass.dll" -Destination "$pluginDir\FluentPass.dll" -Force
          Write-Host "Deployed FluentPass.dll to $pluginDir"

      # --- 快速失败第一道防线：单元测试 (~70% 黄金金字塔分层) ---
      - name: Run Unit Tests (Fast Feedback)
        run: dotnet test tests/FluentPass.Tests/FluentPass.Tests.csproj --configuration Release --no-build --verbosity normal --filter "Category=Unit" /p:KeePassDir="C:\Program Files\KeePass Password Safe 2"

      - name: Archive Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FluentPass-Binary
          path: src/FluentPass/bin/Release/net48/FluentPass.dll
          if-no-files-found: error

      - name: Archive Test Binaries
        uses: actions/upload-artifact@v4
        with:
          name: FluentPass-Test-Binaries
          path: tests/FluentPass.Tests/bin/Release/net48/
          if-no-files-found: error

  # =========================================================================
  # Layer 2 (Parallel A): Integration & Windows Smoke Tests (Windows)
  # =========================================================================
  integration-and-smoke-windows:
    name: Integration & Smoke Tests (Windows)
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Cache KeePass 2.x
        id: cache-keepass
        uses: actions/cache@v4
        with:
          path: C:\Program Files\KeePass Password Safe 2
          key: keepass-2.57.1-win

      - name: Download KeePass 2.x if not cached
        if: steps.cache-keepass.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $keepassDir = "C:\Program Files\KeePass Password Safe 2"
          New-Item -ItemType Directory -Path $keepassDir -Force | Out-Null
          curl.exe -fSL "https://downloads.sourceforge.net/project/keepass/KeePass%202.x/2.57.1/KeePass-2.57.1.zip" -o "$env:TEMP\keepass.zip"
          tar.exe -xf "$env:TEMP\keepass.zip" -C "$keepassDir"

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: FluentPass-Binary
          path: src/FluentPass/bin/Release/net48/

      - name: Download Test Binaries
        uses: actions/download-artifact@v4
        with:
          name: FluentPass-Test-Binaries
          path: tests/FluentPass.Tests/bin/Release/net48/

      - name: Deploy Plugin to KeePass Plugins Directory
        shell: pwsh
        run: |
          $pluginDir = "C:\Program Files\KeePass Password Safe 2\Plugins"
          New-Item -ItemType Directory -Path $pluginDir -Force | Out-Null
          Copy-Item "src\FluentPass\bin\Release\net48\FluentPass.dll" -Destination "$pluginDir\FluentPass.dll" -Force
          # Ensure test runner directory also has FluentPass.dll
          Copy-Item "src\FluentPass\bin\Release\net48\FluentPass.dll" -Destination "tests\FluentPass.Tests\bin\Release\net48\FluentPass.dll" -Force
          Write-Host "Plugin deployed successfully."

      # --- 集成测试分层 (~20% 黄金金字塔分层) ---
      - name: Run Integration Tests
        run: dotnet test tests/FluentPass.Tests/FluentPass.Tests.csproj --configuration Release --no-build --verbosity normal --filter "Category=Integration" /p:KeePassDir="C:\Program Files\KeePass Password Safe 2"

      # --- Windows 冒烟与诊断测试分层 (~10% 黄金金字塔分层) ---
      - name: Run Windows Smoke Tests
        run: dotnet test tests/FluentPass.Tests/FluentPass.Tests.csproj --configuration Release --no-build --verbosity normal --filter "Category=Smoke" /p:KeePassDir="C:\Program Files\KeePass Password Safe 2"

  # =========================================================================
  # Layer 2 (Parallel B): Cross-Platform Linux Headless Smoke Test (Ubuntu)
  # Runs concurrently with Windows Integration & Smoke Tests!
  # =========================================================================
  cross-platform-smoke-linux:
    name: Cross-Platform Smoke Test (Ubuntu + Mono)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: FluentPass-Binary
          path: artifacts/

      - name: Install Mono, KeePass2, Xvfb and Scrot
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-complete keepass2 xvfb scrot xdotool

      - name: Deploy Plugin to KeePass Directories
        run: |
          DLL_PATH=$(find artifacts -name "FluentPass.dll" | head -n 1)
          if [ -z "$DLL_PATH" ]; then
            echo "ERROR: FluentPass.dll not found in artifacts directory!"
            exit 1
          fi
          echo "Found plugin at: $DLL_PATH"
          sudo mkdir -p /usr/lib/keepass2/Plugins
          sudo cp "$DLL_PATH" /usr/lib/keepass2/Plugins/
          sudo chmod 644 /usr/lib/keepass2/Plugins/FluentPass.dll
          mkdir -p ~/.config/KeePass/Plugins
          cp "$DLL_PATH" ~/.config/KeePass/Plugins/

      - name: Configure KeePass to Bypass Setup Wizard
        run: |
          mkdir -p ~/.config/KeePass
          cat << 'EOF' > ~/.config/KeePass/KeePass.config.xml
          <Configuration xmlns:xsd="http://www.w3.org/2001/XMLSchema" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
            <Application>
              <Start>
                <CheckForUpdate>false</CheckForUpdate>
                <CheckForUpdateConfigured>true</CheckForUpdateConfigured>
              </Start>
            </Application>
          </Configuration>
          EOF

      - name: Execute Headless Virtual Desktop Smoke Test
        run: |
          Xvfb :99 -screen 0 1280x800x24 &
          XVFB_PID=$!
          export DISPLAY=:99
          sleep 2

          keepass2 --debug > /tmp/keepass.log 2>&1 &
          KP_PID=$!
          sleep 5

          mkdir -p screenshots
          scrot screenshots/keepass_linux_desktop.png

          if ! kill -0 $KP_PID 2>/dev/null; then
            echo "ERROR: KeePass2 exited prematurely on Linux!"
            cat /tmp/keepass.log
            exit 1
          fi

          echo "KeePass2 is running cleanly with FluentPass installed!"
          cat /tmp/keepass.log

          kill $KP_PID || true
          kill $XVFB_PID || true

      - name: Upload Smoke Test Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Smoke-Screenshot
          path: screenshots/keepass_linux_desktop.png

  # =========================================================================
  # Layer 3: CI Quality Gate Summary
  # =========================================================================
  ci-summary:
    name: CI Quality Gate Summary
    needs: [build, integration-and-smoke-windows, cross-platform-smoke-linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Generate Quality Gate Summary Report
        run: |
          BUILD_STATUS="${{ needs.build.result }}"
          INTEG_STATUS="${{ needs.integration-and-smoke-windows.result }}"
          SMOKE_STATUS="${{ needs.cross-platform-smoke-linux.result }}"

          echo "### 🚀 CI Pipeline Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Pipeline Layer | Platform / Target | Test Pyramid Ratio | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build & Fast-Fail** | Windows Latest (MSBuild + .NET 8) | Unit Tests (~70%) | $BUILD_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| **Deep Verification** | Windows Latest (.NET 4.8 / STA) | Integration Tests (~20%) + Smoke (~10%) | $INTEG_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "| **Cross-Platform Smoke** | Ubuntu Latest (Mono 6.x + Xvfb) | Headless Runtime Smoke | $SMOKE_STATUS |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$BUILD_STATUS" = "success" ] && [ "$INTEG_STATUS" = "success" ] && [ "$SMOKE_STATUS" = "success" ]; then
            echo "✅ **All Quality Gate tiers passed successfully! Ready for release.**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **One or more pipeline layers failed. Check logs above.**" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
